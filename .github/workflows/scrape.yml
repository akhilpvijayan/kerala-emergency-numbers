name: KSDMA contact numbers Scraper
on:
  schedule:
    - cron: '0 12 * * 0'   # Every Sunday at 12:00 UTC
  workflow_dispatch:        # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scraper.py --no-verify-ssl

      - name: Commit updated files
        run: |
          git config user.name "ksdma-bot"
          git config user.email "bot@users.noreply.github.com"
          git add district_emergency_numbers.json
          git commit -m "Update contact data $(date -u)" || echo "No changes to commit"
          git push
